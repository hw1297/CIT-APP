<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CIT본부">
<link rel="apple-touch-icon" href="icon-180.png">
<title>CIT본부</title>
<style>
html,body{margin:0;height:100%;background:#0a1730}
iframe{border:0;width:100%;height:100%;display:block}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a1730;color:#cbd5e1;font-family:-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;letter-spacing:.3px;z-index:10;transition:opacity .4s ease}
#loader.hide{opacity:0;pointer-events:none}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.18);border-top-color:#60a5fa;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div><div>Loading...</div></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyJMq6n4ZTn7d5E9i0DDg-HrpA_jELxi-4geJ-QNTUPCMgYfu35mqCd0-8XurEUhsQkvg/exec"></iframe>
<script>
(function(){
  var loader=document.getElementById("loader");
  function hide(){ loader.classList.add("hide"); setTimeout(function(){ loader.style.display="none"; },500); }
  document.getElementById("app").addEventListener("load", function(){ setTimeout(hide,300); });
  // 혹시 load 이벤트가 안 와도 로딩 화면이 영원히 남지 않도록 안전장치
  setTimeout(hide,15000);
})();
</script>
</body>
</html>
